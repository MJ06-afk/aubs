  </head>
  <body>
    <style>
      #aubs-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #070707;
        animation: aubs-fade 0.6s ease-out 0.4s forwards;
      }
      #aubs-loader .mark {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 2.75rem; font-weight: 400;
        letter-spacing: 0.55em; text-indent: 0.55em;
        color: #FBF9F2;
      }
      #aubs-loader .rule {
        width: 140px; height: 1px; margin-top: 1.75rem;
        background: rgba(198,159,88,0.25); overflow: hidden;
      }
      #aubs-loader .rule::after {
        content: ''; display: block;
        width: 40%; height: 100%; background: #C69F58;
        animation: aubs-sweep 1.4s ease-in-out infinite;
      }
      @keyframes aubs-sweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @keyframes aubs-fade {
        to { opacity: 0; visibility: hidden; }
      }
    </style>
    <div id="root">
      <div id="aubs-loader">
        <div class="mark">AUBS</div>
        <div class="rule"></div>
      </div>
    </div>
   <script type="module" src="/src/main.jsx"></script>
  </body>
