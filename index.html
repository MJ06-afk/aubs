<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="AUBS Jewellery — L'art du luxe. Grillz sur mesure, chaînes, bagues, bracelets et pendentifs en or, diamant et pierres précieuses. Savoir-faire artisanal d'exception." />
    <meta name="keywords" content="grillz sur mesure, bijoux de luxe, or, diamant, joaillerie, AUBS, grillz personnalisé, chaînes or, bagues diamant" />
    <meta property="og:title" content="AUBS Jewellery — L'Art du Luxe" />
    <meta property="og:description" content="Des bijoux d'exception. Un savoir-faire unique. Conçus pour ceux qui ne suivent pas les tendances, mais qui les définissent." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
    <title>AUBS Jewellery — L'Art du Luxe</title>
  </head>
  <body>
    <style>
      #aubs-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #070707;
        animation: aubs-fade 0.6s ease-out 0.4s forwards;
      }
      #aubs-loader .mark {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 2.75rem; font-weight: 400;
        letter-spacing: 0.55em; text-indent: 0.55em;
        color: #FBF9F2;
      }
      #aubs-loader .rule {
        width: 140px; height: 1px; margin-top: 1.75rem;
        background: rgba(198,159,88,0.25); overflow: hidden;
      }
      #aubs-loader .rule::after {
        content: ''; display: block;
        width: 40%; height: 100%; background: #C69F58;
        animation: aubs-sweep 1.4s ease-in-out infinite;
      }
      @keyframes aubs-sweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @keyframes aubs-fade {
        to { opacity: 0; visibility: hidden; }
      }
    </style>
    <div id="root">
      <div id="aubs-loader">
        <div class="mark">AUBS</div>
        <div class="rule"></div>
      </div>
    </div>
   <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
